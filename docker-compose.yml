# Local MySQL 8 for the pipeline. Host port 3308 so it won't clash with a MySQL already on 3306.
services:
  db:
    image: mysql:8.0
    container_name: contact_centre_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_pass
      MYSQL_DATABASE: contact_centre
      MYSQL_USER: pipeline
      MYSQL_PASSWORD: pipeline_pass
      TZ: Australia/Brisbane
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-upipeline", "-ppipeline_pass"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  mysql_data:
